<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b35"><title>Hansefürst</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4e8d0;background:#0e2029}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#274752,#0e2029 60%);min-height:100vh}header{padding:22px 16px 12px;background:#102631;border-bottom:2px solid #bd9a5b}h1{font-family:Georgia,serif;font-size:32px;color:#f5d491;margin:0}h2{font:24px Georgia,serif;color:#f5d491;margin:0 0 12px}p{line-height:1.5}.sub{color:#c3c4b8;font-size:13px}.wrap{max-width:1050px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}.stat,.panel{background:#1a3440;border:1px solid #46606a;border-radius:14px;padding:13px}.stat strong{display:block;color:#f5d491;font-size:21px}.stat small{color:#c8d0cd}.tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 0 12px}.tabs button{white-space:nowrap}button,select,input{font:inherit}button{background:#b99150;color:#10212b;border:0;border-radius:10px;padding:12px 14px;font-weight:750;cursor:pointer;min-height:44px}button:disabled{opacity:.35;cursor:not-allowed}button.alt{background:#294e5c;color:#fff;border:1px solid #54737d}button.active{background:#f2d291}button.small{padding:8px 10px;min-height:36px}.panel{margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#bdc9c7}.good{color:#8fd7aa}.bad{color:#ffad9b}.goods{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:9px}.goodcard{background:#112a35;border:1px solid #46606a;border-radius:11px;padding:12px}.goodcard .row{margin-top:8px}.qty{width:65px;background:#f8f0df;border-radius:8px;border:0;padding:9px;color:#15252a}.city-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.city{background:#122c37;border:1px solid #4d6770;border-radius:12px;padding:14px}.city.current{border-color:#f2d291}.shipart{font-size:48px;text-align:center;padding:5px}.notice{background:#273f43;border-left:4px solid #e0bd79;padding:12px;border-radius:8px;margin:10px 0}.journal{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #3d5660;padding:9px 5px;text-align:left}.scroll{overflow-x:auto}select{padding:10px;border-radius:8px;background:#f8f0df;max-width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;color:#96aaa9;font-size:12px;padding:20px}.overlay{position:fixed;inset:0;background:#08151bdc;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:#1a3541;border:2px solid #d8b36c;border-radius:18px;max-width:470px;padding:22px;width:100%;max-height:90vh;overflow:auto}.modal label{display:block;margin:12px 0}.modal input{width:100%;padding:12px;border-radius:8px;border:0}.hidden{display:none!important}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}header{padding-left:max(16px,calc((100vw - 1020px)/2))}}
</style></head><body><header><h1>⚓ Hansefürst</h1><div class="sub">Vom Kaufmann zum Eldermann · Anno 1350</div></header><main class="wrap"><div id="stats" class="stats"></div><nav class="tabs" id="tabs"></nav><div id="view"></div></main><footer>Hansefürst · Originales kleines Hanse-Handelsspiel · Spielstand nur auf diesem Gerät</footer><div id="welcome" class="overlay hidden"><div class="modal"><h2>Willkommen in der Hanse!</h2><p>Wähle deinen Kaufmann. Beide dürfen die Geburtstagsüberraschungen des anderen entdecken.</p><label>Dein Kaufmann <select id="player"><option value="Ulf">Ulf – Der Grüne Eldermann</option><option value="Anders">Anders – Der Hansegras-Baron</option></select></label><label>Spielstandname <input id="playername" value="Ulf" maxlength="24"></label><div class="actions"><button onclick="newGame()">Handelsreise beginnen ⚓</button><button class="alt" onclick="document.getElementById('importfile').click()">Spielstand laden</button></div></div></div><input id="importfile" type="file" accept=".json,application/json" class="hidden" onchange="importSave(event)"><script>
const CITIES=['Lübeck','Hamburg','Rostock','Stralsund','Stettin'];const GOODS=[['Getreide','🌾',16],['Bier','🍺',25],['Holz','🪵',19],['Salz','🧂',31],['Fisch','🐟',22],['Tuch','🧵',56],['Hansegras','🌿',84]];const DIST=[[0,2,2,3,4],[2,0,3,4,5],[2,3,0,2,3],[3,4,2,0,2],[4,5,3,2,0]];const KEY='hansefuerst-v01';let s=null,tab='handel';const $=id=>document.getElementById(id);const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const fmt=n=>Math.round(n).toLocaleString('de-DE');function initial(){return {version:1,player:$('player').value,name:$('playername').value.trim()||$('player').value,day:1,year:1350,gold:5000,rep:0,rank:0,city:0,ship:{name:'Kleine Kogge',capacity:80,cargo:{},travel:null},markets:CITIES.map((_,i)=>GOODS.map((g,j)=>({price:Math.round(g[2]*(.7+Math.random()*.65)),stock:rnd(30,135)}))),journal:{},messages:['Willkommen in Lübeck. Kaufe günstig ein und verkaufe in anderen Städten.'],birthdaySeen:{},secret:false,electionCooldown:0,turns:0};}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){toast('Speichern fehlgeschlagen. Bitte Spielstand exportieren.')}}function newGame(){s=initial();s.secret=true;observe();save();$('welcome').classList.add('hidden');tab='handel';render();birthday();}function toast(msg){s.messages.unshift(msg);s.messages=s.messages.slice(0,16);save();render();}function observe(){if(s.ship.travel)return;let c=s.city;s.journal[c]={day:s.day,year:s.year,prices:s.markets[c].map(m=>m.price)};}function weight(){return Object.values(s.ship.cargo).reduce((a,b)=>a+b,0)}function worth(){let cargo=Object.entries(s.ship.cargo).reduce((a,[j,n])=>a+n*GOODS[j][2],0);return s.gold+cargo+4500}function rankName(){return ['Kaufmann','Fernkaufmann','Ratsherr','Bürgermeister','Eldermann'][s.rank]}function date(){return `Tag ${s.day}, ${s.year}`}function birthday(){let d=new Date(),key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;let who=d.getMonth()===9&&d.getDate()===23?'Anders':d.getMonth()===11&&d.getDate()===23?'Ulf':null;if(who&&!s.birthdaySeen[key]){s.birthdaySeen[key]=true;s.gold+=230;s.rep+=3;save();setTimeout(()=>alert(who==='Anders'?'🎂 Höret, höret! Der Hansegras-Baron Anders feiert heute! Der Rat gewährt 230 Goldstücke und 3 Ansehen. 🌿':'🎂 Höret, höret! Ulf, der Grüne Eldermann, feiert heute! Der Rat gewährt 230 Goldstücke und 3 Ansehen. 👑🌿'),150);}}function render(){if(!s){$('welcome').classList.remove('hidden');return}let tr=s.ship.travel;$('stats').innerHTML=`<div class="stat"><small>Gold</small><strong>${fmt(s.gold)} 🪙</strong></div><div class="stat"><small>Ansehen</small><strong>${s.rep} ⭐</strong></div><div class="stat"><small>Rang</small><strong style="font-size:17px">${rankName()}</strong></div><div class="stat"><small>Ort · ${date()}</small><strong style="font-size:17px">${tr?'Auf See 🌊':CITIES[s.city]}</strong></div>`;let tabs=[['handel','⚖️ Handel'],['reise','⛵ Reisen'],['buch','📒 Handelsbuch'],['rat','👑 Karriere'],['chronik','📜 Chronik'],['speichern','💾 Spielstand']];$('tabs').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'active':'alt'}" onclick="tab='${k}';render()">${n}</button>`).join('');$('view').innerHTML=({handel:tradeView,reise:travelView,buch:bookView,rat:careerView,chronik:logView,speichern:saveView})[tab]();}function tradeView(){if(s.ship.travel)return `<div class="panel"><h2>🌊 Auf hoher See</h2><p>Deine Kogge ist nach ${CITIES[s.ship.travel.to]} unterwegs. Noch ${s.ship.travel.left} Tag(e).</p><button onclick="nextDay()">Nächster Tag →</button></div>`;let market=s.markets[s.city];return `<div class="panel"><div class="row"><div><h2>Markt von ${CITIES[s.city]}</h2><div class="muted">Kaufe und verkaufe Waren. Der freie Laderaum beträgt ${s.ship.capacity-weight()} von ${s.ship.capacity} Fass.</div></div><button class="alt" onclick="nextDay()">⏳ Tag verstreichen lassen</button></div></div><div class="goods">${GOODS.map((g,j)=>`<div class="goodcard"><div class="row"><strong>${g[1]} ${g[0]}</strong><strong>${market[j].price} 🪙</strong></div><div class="sub">Marktvorrat: ${market[j].stock} · An Bord: ${s.ship.cargo[j]||0}</div><div class="row"><input class="qty" id="qty${j}" type="number" min="1" max="80" value="5" inputmode="numeric"><button class="small" onclick="transact(${j},1)">Kaufen</button><button class="small alt" onclick="transact(${j},-1)">Verkaufen</button></div></div>`).join('')}</div><div class="notice">🌿 Gerücht aus der Schenke: Eine besondere Ware namens <b>Hansegras</b> macht unter den Kaufleuten die Runde. Ihr Ursprung bleibt ein Geheimnis.</div>`}function transact(j,dir){let n=Math.floor(Number($('qty'+j).value));if(!Number.isFinite(n)||n<1||n>10000)return toast('Bitte eine gültige Menge eingeben.');let m=s.markets[s.city][j],own=s.ship.cargo[j]||0;if(dir===1){if(n>m.stock)return toast('So viel Ware ist am Markt nicht verfügbar.');if(n> s.ship.capacity-weight())return toast('Nicht genug Platz auf der Kogge.');if(n*m.price>s.gold)return toast('Dein Gold reicht dafür nicht.');s.gold-=n*m.price;m.stock-=n;s.ship.cargo[j]=own+n;m.price=Math.max(4,Math.round(m.price*(1+n/Math.max(120,m.stock+60)*.24)));s.messages.unshift(`${date()}: ${n} ${GOODS[j][0]} in ${CITIES[s.city]} gekauft.`)}else{if(n>own)return toast('So viel Ware hast du nicht an Bord.');s.gold+=n*m.price;s.ship.cargo[j]=own-n;m.stock+=n;m.price=Math.max(4,Math.round(m.price*(1-n/Math.max(120,m.stock+60)*.2)));let gain=m.stock<70?3:1;s.rep+=gain;s.messages.unshift(`${date()}: ${n} ${GOODS[j][0]} verkauft (+${gain} Ansehen).`)}s.messages=s.messages.slice(0,16);observe();save();render()}function travelView(){let tr=s.ship.travel;return `<div class="panel"><h2>⛵ ${s.ship.name}</h2><div class="shipart">⛵</div><p>${tr?`Auf Fahrt nach <b>${CITIES[tr.to]}</b> · noch ${tr.left} Tage.`:`Liegt im Hafen von <b>${CITIES[s.city]}</b>.`}</p><p>Ladung: ${weight()} / ${s.ship.capacity} Fass</p><div class="muted">${Object.entries(s.ship.cargo).filter(([j,n])=>n>0).map(([j,n])=>`${GOODS[j][1]} ${GOODS[j][0]}: ${n}`).join(' · ')||'Der Laderaum ist leer.'}</div></div><div class="panel"><h2>Hansestädte</h2><div class="city-grid">${CITIES.map((c,i)=>`<div class="city ${!tr&&i===s.city?'current':''}"><h3>${c}</h3><p class="sub">${!tr&&i===s.city?'Dein aktueller Hafen':`${DIST[s.city][i]} Tage Seereise`}</p><button class="small" ${tr||i===s.city?'disabled':''} onclick="sail(${i})">Kurs setzen ⚓</button></div>`).join('')}</div></div>${tr?'<button onclick="nextDay()">⏳ Nächster Tag</button>':''}`;}function sail(i){if(s.ship.travel||i===s.city)return;s.ship.travel={to:i,left:DIST[s.city][i]};s.messages.unshift(`${date()}: Abfahrt von ${CITIES[s.city]} nach ${CITIES[i]}.`);save();tab='reise';render()}function nextDay(){s.day++;if(s.day>360){s.day=1;s.year++}s.turns++;s.markets.forEach((city,i)=>city.forEach((m,j)=>{let base=GOODS[j][2],target=Math.round(base*(.7+Math.random()*.7));m.price=Math.max(4,Math.round(m.price*.76+target*.24+rnd(-2,2)));m.stock=Math.max(4,Math.min(180,m.stock+rnd(-12,15)));}));if(s.ship.travel){s.ship.travel.left--;if(s.ship.travel.left<=0){s.city=s.ship.travel.to;s.ship.travel=null;s.rep+=2;s.messages.unshift(`${date()}: In ${CITIES[s.city]} angekommen (+2 Ansehen).`);observe()}}if(s.turns%6===0){let c=rnd(0,4),j=rnd(0,6);s.markets[c][j].stock=Math.max(5,s.markets[c][j].stock-rnd(15,35));s.messages.unshift(`Ein konkurrierender Händler kaufte ${GOODS[j][0]} in ${CITIES[c]}.`)}save();render();birthday()}function bookView(){return `<div class="panel"><h2>📒 Dein Handelsbuch</h2><p class="muted">Nur selbst besuchte Märkte sind verzeichnet. Preise können inzwischen anders sein.</p><div class="scroll"><table class="journal"><thead><tr><th>Stadt</th>${GOODS.map(g=>`<th>${g[1]} ${g[0]}</th>`).join('')}<th>Stand</th></tr></thead><tbody>${CITIES.map((c,i)=>`<tr><td><b>${c}</b></td>${GOODS.map((_,j)=>`<td>${s.journal[i]?s.journal[i].prices[j]:'—'}</td>`).join('')}<td>${s.journal[i]?`Tag ${s.journal[i].day}/${s.journal[i].year}`:'Unbesucht'}</td></tr>`).join('')}</tbody></table></div></div>`}function careerView(){let steps=[['Kaufmann',0,0],['Fernkaufmann',20000,0],['Ratsherr',50000,30],['Bürgermeister',100000,60],['Eldermann',250000,100]],next=steps[s.rank+1],eligible=next&&worth()>=next[1]&&s.rep>=next[2];return `<div class="panel"><h2>👑 Der Rat der Hanse</h2><p>Aktueller Rang: <b>${rankName()}</b></p><p>Geschätztes Vermögen: <b>${fmt(worth())} Gold</b> (inklusive Schiff und Ladung).</p>${next?`<p>Nächstes Ziel: <b>${next[0]}</b> – ${fmt(next[1])} Gold Vermögen und ${next[2]} Ansehen.</p><button ${eligible?'':'disabled'} onclick="promote()">${s.rank>=2?'Zur Wahl antreten':'Aufstieg beantragen'}</button>${!eligible?'<p class="sub">Du benötigst noch mehr Vermögen oder Ansehen.</p>':''}`:'<div class="notice">🏆 Du hast das höchste Amt der Hanse erreicht! Du kannst unbegrenzt weiterspielen.</div>'}</div><div class="panel"><h2>Die Ehren der Hanse 🌿</h2><p><b>Ulf:</b> Der Grüne Eldermann 👑🌿</p><p><b>Anders:</b> Der Hansegras-Baron 🌿</p><p class="sub">Ehrentitel sind persönliche Auszeichnungen und ersetzen keine politischen Ämter. Am 23. Oktober feiern wir Anders, am 23. Dezember Ulf. Beide dürfen beide Feste erleben.</p><button class="alt" onclick="showCharter()">📜 Geheime Hanse-Urkunde lesen</button></div>`}function promote(){let steps=[0,20000,50000,100000,250000],reps=[0,0,30,60,100],i=s.rank+1;if(i>4||worth()<steps[i]||s.rep<reps[i])return;if(i>=3){let chance=Math.min(.95,.65+(s.rep-reps[i])*.006);if(Math.random()>chance){s.rep+=3;s.messages.unshift('Die Wahl ging knapp verloren. Der Rat ermutigt dich, es erneut zu versuchen.');save();render();return}}s.rank=i;s.messages.unshift(`🎉 ${s.name} wurde zum ${rankName()} ernannt!`);save();render();alert(`🎉 Der Rat verkündet: ${s.name} ist jetzt ${rankName()}!`)}function showCharter(){alert('📜 Im Namen der ehrwürdigen Hanse: Ulf, Grüner Eldermann, und Anders, Hansegras-Baron, mögen ihre Koggen stets volle Laderäume und ihre Taschen klingende Münzen tragen! Am 23.10. und 23.12. läuten die Glocken. 🌿⚓')}function logView(){return `<div class="panel"><h2>📜 Chronik</h2>${s.messages.map(m=>`<div class="notice">${m.replace(/</g,'&lt;')}</div>`).join('')}</div>`}function saveView(){return `<div class="panel"><h2>💾 Spielstand</h2><p>Dein Spiel wird automatisch <b>nur auf diesem Gerät und in diesem Browser</b> gespeichert. Für den Wechsel zwischen iPhone und iPad kannst du eine Datei übertragen.</p><div class="actions"><button onclick="exportSave()">⬇️ Spielstand exportieren</button><button class="alt" onclick="$('importfile').click()">⬆️ Spielstand importieren</button></div><p class="sub">Tipp: Exportiere regelmäßig eine Sicherung. Wenn du Safari-Daten löschst, kann der lokale Spielstand verloren gehen.</p></div><div class="panel"><h2>Neues Spiel</h2><p>Aktiver Kaufmann: <b>${s.name}</b> (${s.player})</p><button class="alt" onclick="if(confirm('Neues Spiel beginnen? Der bisherige lokale Spielstand wird überschrieben.')){s=null;localStorage.removeItem(KEY);$('welcome').classList.remove('hidden');}">Neues Spiel starten</button></div>`}function exportSave(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hansefuerst-spielstand.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.version!==1||!Array.isArray(x.markets)||x.markets.length!==5||!x.ship||!x.messages||!x.journal)throw Error();if(s&&!confirm('Aktuellen Spielstand durch die Datei ersetzen?'))return;s=x;save();$('welcome').classList.add('hidden');render();birthday();alert('Spielstand erfolgreich geladen!')}catch(err){alert('Die Datei ist kein gültiger Hansefürst-Spielstand.')}e.target.value=''};r.readAsText(f)}try{let old=localStorage.getItem(KEY);if(old){s=JSON.parse(old);if(s.version!==1)s=null}}catch(e){s=null}render();if(s)birthday();
</script></body></html>
