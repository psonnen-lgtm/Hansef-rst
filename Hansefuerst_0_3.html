<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192c32"><title>Hansefürst 0.3 – Lebendige Hanse</title><style>
:root{font-family:Georgia,serif;color:#f2e2bf;background:#15232a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#253b42,#101d25);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;min-height:43px;padding:9px 12px;border:2px solid #e4b875;background:#8a5a31;color:#fff1cc;border-radius:4px;font-weight:bold;box-shadow:2px 3px #0c1316}button:disabled{opacity:.38;cursor:not-allowed}button:active{transform:translate(1px,2px);box-shadow:none}.ghost{background:#344c4b;border-color:#8c9c88}.danger{background:#783e37}.top{background:#24231f;border-bottom:4px solid #b88d4c;padding:13px max(12px,calc((100vw - 1080px)/2))}.top h1{margin:0;font-size:31px;color:#f6d18c;text-shadow:2px 2px #111}.subtitle{color:#c3b69a;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 12px}.stat{background:#29342e;border:2px solid #8b6e45;padding:8px}.stat small{display:block;color:#c2bea9;font-size:11px}.stat b{display:block;color:#f7d792;font-size:clamp(13px,2.7vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scene{position:relative;border:5px ridge #c29b5b;background:#6d9ca9;box-shadow:0 5px #0c1519}.scene canvas{display:block;width:100%;image-rendering:pixelated;aspect-ratio: 640/330}.spot{position:absolute;font:700 clamp(10px,1.6vw,15px) Georgia,serif;padding:6px 9px;min-height:34px;background:#192b2bdc;border:2px solid #f0c67b;color:#fff2cf;box-shadow:1px 2px #111}.spot:hover{background:#75512d}.spot.market{left:5%;top:38%}.spot.bath{left:29%;top:36%}.spot.church{left:52%;top:25%}.spot.bank{right:5%;top:40%}.spot.harbor{left:34%;bottom:8%}.spot.hall{right:18%;top:16%}.spot.contor{left:3%;bottom:7%}.spot.map{right:3%;bottom:8%}.below{padding:12px;background:#262c27;border:2px solid #8b6e45;border-top:0;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.below strong{color:#f4d18d}.below span{font-size:13px;color:#d7d0b9}.footnav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.footnav button{flex:1;font-size:13px}.card{background:#28332e;border:2px solid #8b6e45;padding:15px;margin:12px 0}.card h2,.sheet h2{color:#573d26;font-size:27px;margin:0 0 10px}.card h2{color:#f1ce91}.card p{line-height:1.5}.overlay{position:fixed;inset:0;background:#071014dd;z-index:10;display:grid;place-items:center;padding:12px}.overlay.hidden{display:none}.sheet{background:#e6d0a0;color:#46311e;border:8px ridge #a67a42;box-shadow:0 12px 35px #0009;width:min(720px,100%);max-height:92dvh;overflow:auto;padding:18px;background-image:repeating-linear-gradient(0deg,#ffffff09 0 3px,#b18d560a 3px 6px)}.sheet h2{font-size:27px}.sheet p{line-height:1.5}.sheet button{margin:3px}.sheet .ghost{color:#fff1d6}.closebar{display:flex;align-items:start;justify-content:space-between;gap:10px}.closebar button{min-height:35px;padding:5px 10px}.muted{color:#786044;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}.item{border:2px solid #b99b6a;padding:10px;background:#f3e2bc}.item h3{margin:0 0 5px;font-size:18px}.item p{margin:5px 0}.item input{width:68px;padding:8px;border:1px solid #9b7e51;background:#fff5df;color:#34281b}.item button{font-size:13px;padding:6px 8px;min-height:38px}.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.booktable{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}.booktable td,.booktable th{border-bottom:1px solid #b69c71;padding:8px 5px;text-align:left}.scroll{overflow:auto}.good{color:#207a43;font-weight:bold}.bad{color:#a2382c;font-weight:bold}.notice{background:#f4e4c1;border-left:4px solid #9c6d38;padding:10px;margin:9px 0}.log{background:#263c3b;border-left:3px solid #d7ac68;padding:10px;margin:7px 0;font-size:14px}.mapart{width:100%;height:auto;image-rendering:pixelated;border:3px ridge #ab804c}.sea{background:linear-gradient(#7da4aa 0 47%,#2c7186 47%);height:185px;position:relative;overflow:hidden;border:5px ridge #ab804c;margin:10px 0}.sea:after{content:'⛵';font-size:100px;position:absolute;left:35%;bottom:0;text-shadow:3px 3px #1e4c58}.tag{font-size:12px;background:#8b693e;color:#fff3d4;padding:4px 7px;display:inline-block}.intro{max-width:500px}.intro select,.intro input{padding:10px;width:100%;margin:7px 0 14px;background:#fff2d4;border:1px solid #b39b71}.mini{font-size:12px;color:#bcbba9}.gold{color:#f5d38b}.split{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.progress{background:#a9916e;height:12px;border:1px solid #806340;margin:8px 0}.progress i{display:block;background:#4e815d;height:100%}@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.spot{font-size:10px;padding:4px 5px;min-height:29px}.spot.bath{left:25%}.spot.church{left:47%}.spot.hall{right:13%}.sheet{padding:11px;border-width:5px}.footnav button{flex:1 1 42%}.scene canvas{min-height:205px;object-fit:cover}.sheet h2{font-size:23px}}
</style></head><body><header class="top"><h1>⚓ Hansefürst <small style="font-size:13px">0.3</small></h1><div class="subtitle">Eine lebendige Hanse · Anno 1350 · Tippe auf Gebäude und Gegenstände</div></header><main class="wrap"><section class="stats" id="stats"></section><section class="scene"><canvas id="cityCanvas" width="640" height="330" aria-label="Pixelansicht der Hansestadt"></canvas><button class="spot market" onclick="show('market')">📖 Handel</button><button class="spot bath" onclick="show('bath')">♨️ Badehaus</button><button class="spot church" onclick="show('church')">⛪ Kirche</button><button class="spot hall" onclick="show('hall')">🏛️ Rathaus</button><button class="spot bank" onclick="show('bank')">💰 Bank</button><button class="spot contor" onclick="show('contor')">🏠 Kontor</button><button class="spot harbor" onclick="show('harbor')">⛵ Hafen & Werft</button><button class="spot map" onclick="show('map')">🗺️ Seekarte</button></section><div class="below"><div><strong id="place"></strong><br><span id="hint">Tippe auf ein Gebäude, um es zu besuchen.</span></div><button class="ghost" onclick="show('chronicle')">📜 Chronik</button></div><nav class="footnav"><button class="ghost" onclick="show('book')">📒 Handelsbuch</button><button class="ghost" onclick="show('quests')">📦 Aufträge</button><button class="ghost" onclick="show('ships')">⛵ Meine Schiffe</button><button class="ghost" onclick="show('save')">💾 Spielstand</button></nav><div class="mini">Automatische Speicherung auf diesem Gerät · Handelsreisen ohne Wartezeit · Spielstandexport empfohlen</div></main><div class="overlay hidden" id="overlay"><article class="sheet" id="sheet"></article></div><input id="file" type="file" accept=".json,application/json" hidden onchange="importGame(event)"><script>
'use strict';
const CITIES=['Lübeck','Hamburg','Rostock','Stralsund','Stettin'];
const GOODS=[['Getreide','🌾',16],['Bier','🍺',25],['Holz','🪵',19],['Salz','🧂',31],['Fisch','🐟',22],['Tuch','🧵',56],['Hansegras','🌿',84]];
const DIST=[[0,2,2,3,4],[2,0,3,4,5],[2,3,0,2,3],[3,4,2,0,2],[4,5,3,2,0]];
const KEY='hansefuerst-v03',OLD='hansefuerst-v01';
const SHIPTYPES=[{name:'Schnigge',cap:55,speed:1.5,cost:3800},{name:'Kogge',cap:90,speed:1,cost:6200},{name:'Holk',cap:140,speed:.72,cost:10500}];
const $=id=>document.getElementById(id),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>Math.round(n).toLocaleString('de-DE'),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let s=null,view='',pending=null;
function makeShip(type=1){let t=SHIPTYPES[type];return {id:Date.now()+Math.random(),name:t.name,type,capacity:t.cap,speed:t.speed,condition:100,arms:0,cargo:{},costs:{}}}
function fresh(player,name){return {v:3,player,name,day:1,year:1350,city:0,gold:5000,rep:0,rank:0,ships:[makeShip(1)],active:0,bank:0,debt:0,markets:CITIES.map(()=>GOODS.map(g=>({price:Math.round(g[2]*(.7+Math.random()*.6)),stock:r(35,130)}))),journal:{},messages:['Willkommen in Lübeck! Die Hanse erwartet einen neuen Kaufmann.'],rumors:[],quests:[],completed:0,birthdaySeen:{},flags:{},visits:1};}
function migrate(x){if(x&&x.v===3)return x;if(!x||x.version!==1||!x.ship||!Array.isArray(x.markets))return null;let y=fresh(x.player||'Ulf',x.name||'Kaufmann');y.day=x.day||1;y.year=x.year||1350;y.city=x.city||0;y.gold=x.gold||0;y.rep=x.rep||0;y.rank=x.rank||0;y.markets=x.markets;y.journal=x.journal||{};y.messages=x.messages||[];y.birthdaySeen=x.birthdaySeen||{};y.ships[0].name=x.ship.name||'Kleine Kogge';y.ships[0].capacity=x.ship.capacity||80;y.ships[0].cargo=x.ship.cargo||{};return y}
function save(){if(s)try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){console.warn('Speichern fehlgeschlagen',e)}}
function log(t){s.messages.unshift(`Tag ${s.day}: ${t}`);s.messages=s.messages.slice(0,40);save()}
function ship(){return s.ships[s.active]||s.ships[0]}
function load(q=ship()){return Object.values(q.cargo).reduce((a,b)=>a+(+b||0),0)}
function capacity(q=ship()){return Math.max(15,q.capacity-q.arms*10)}
function cargoWorth(){return s.ships.reduce((sum,q)=>sum+Object.entries(q.cargo).reduce((a,[j,n])=>a+n*GOODS[j][2],0),0)}
function netWorth(){return s.gold+s.bank-s.debt+cargoWorth()+s.ships.reduce((a,q)=>a+SHIPTYPES[q.type].cost*(.45+.35*q.condition/100),0)}
function rank(){return ['Kaufmann','Fernkaufmann','Ratsherr','Bürgermeister','Eldermann'][s.rank]}
function observe(){s.journal[s.city]={day:s.day,year:s.year,prices:s.markets[s.city].map(m=>m.price)}}
function advance(days){for(let i=0;i<days;i++){s.day++;if(s.day>360){s.day=1;s.year++;s.bank=Math.round(s.bank*1.02);s.debt=Math.ceil(s.debt*1.06);log('Jahreswechsel: Guthaben verzinst, Kreditzinsen berechnet.')}for(let c=0;c<5;c++)for(let j=0;j<GOODS.length;j++){let m=s.markets[c][j];if(Math.random()<.35)m.price=Math.max(4,Math.round(m.price*(.94+Math.random()*.12)));m.stock=Math.max(3,Math.min(240,m.stock+r(-6,9)))}}for(let tip of s.rumors){if(tip.special&&tip.until<totalDay()&&!tip.expired){s.markets[tip.city][tip.j].price=Math.round(GOODS[tip.j][2]*(.8+Math.random()*.5));tip.expired=true;log('Ein zeitlich begrenztes Sondergeschäft ist abgelaufen.')}}s.rumors=s.rumors.filter(x=>x.until>=s.year*360+s.day);s.quests=s.quests.filter(x=>x.until>=s.year*360+s.day);}
function totalDay(){return s.year*360+s.day}
function render(){if(!s)return; $('stats').innerHTML=`<div class="stat"><small>Goldstücke</small><b>${fmt(s.gold)} 🪙</b></div><div class="stat"><small>Rang</small><b>${esc(rank())}</b></div><div class="stat"><small>Ansehen</small><b>${fmt(s.rep)} ⭐</b></div><div class="stat"><small>Datum</small><b>Tag ${s.day} · ${s.year}</b></div>`;$('place').textContent='⚓ '+CITIES[s.city];$('hint').textContent=`${s.ships.length} Schiff(e) · ${fmt(netWorth())} G geschätztes Nettovermögen`;drawCity();save()}
function openSheet(title,html){$('sheet').innerHTML=`<div class="closebar"><h2>${title}</h2><button class="ghost" onclick="closeSheet()">✕</button></div>${html}`;$('overlay').classList.remove('hidden')}
function closeSheet(){$('overlay').classList.add('hidden');view='';render()}
function show(v){view=v;let f=({market:marketView,bath:bathView,church:churchView,hall:hallView,bank:bankView,contor:contorView,harbor:harborView,map:mapView,book:bookView,quests:questsView,ships:shipsView,save:saveView,chronicle:chronicleView,travel:travelView,arrival:arrivalView})[v];if(f)f()}
function notice(t){openSheet('📜 Nachricht',`<p>${esc(t)}</p><button onclick="closeSheet()">Verstanden</button>`)}
function marketView(){observe();let rows=GOODS.map(([name,icon],j)=>{let m=s.markets[s.city][j],q=ship(),own=q.cargo[j]||0,buy=Math.min(m.stock,capacity(q)-load(q),Math.floor(s.gold/m.price));let paid=q.costs[j]||0;return `<div class="item"><h3>${icon} ${name}</h3><p><b>${m.price} G</b> je Fass · Markt: ${m.stock} · An Bord: ${own}</p><p class="muted">${own?`Dein Ø-Einkauf: ${Math.round(paid)} G · ${m.price>=paid?'<span class="good">Gewinn möglich</span>':'<span class="bad">Verlust möglich</span>'}`:'Noch keine Ware geladen'}</p><div class="actions"><input id="qty${j}" type="number" min="1" max="999" value="1" aria-label="Menge ${name}"><button ${buy<1?'disabled':''} onclick="trade(${j},1)">Kaufen</button><button ${own<1?'disabled':''} class="ghost" onclick="trade(${j},-1)">Verkaufen</button></div></div>`}).join('');openSheet('📖 Das Handelsbuch',`<p>Markt zu ${esc(CITIES[s.city])} · <b>${fmt(s.gold)} Gold</b> · Freier Laderaum: ${capacity()-load()} Fass</p><p class="muted">Die Preise verändern sich. Der angezeigte Gewinn vergleicht den heutigen Verkaufspreis mit deinem durchschnittlichen Einkaufspreis.</p><div class="grid">${rows}</div><p class="muted">Tipp: Im Handelsbuch findest du frühere Preise bereits besuchter Städte.</p><button class="ghost" onclick="show('book')">📒 Preisaufzeichnungen</button>`)}
function trade(j,dir){let n=Math.floor(Number($('qty'+j).value)),m=s.markets[s.city][j],q=ship();if(!Number.isFinite(n)||n<1)return notice('Bitte eine gültige Fasszahl eingeben.');if(dir===1){if(n>m.stock||n>capacity(q)-load(q)||n*m.price>s.gold)return notice('Nicht genügend Gold, Warenbestand oder Laderaum.');if(n*m.price>s.gold*.7&&!confirm('Du investierst über 70 % deines Bargelds. Trotzdem kaufen?'))return;let old=q.cargo[j]||0;q.costs[j]=((q.costs[j]||0)*old+m.price*n)/(old+n);q.cargo[j]=old+n;s.gold-=n*m.price;m.stock-=n;log(`${n} Fass ${GOODS[j][0]} für ${fmt(n*m.price)} G gekauft.`)}else{if(n>(q.cargo[j]||0))return notice('So viel Ware hast du nicht an Bord.');let gain=n*m.price,profit=n*(m.price-(q.costs[j]||m.price));s.gold+=gain;q.cargo[j]-=n;if(!q.cargo[j]){delete q.cargo[j];delete q.costs[j]}m.stock+=n;s.rep+=profit>0?Math.min(2,Math.floor(profit/250)):0;log(`${n} Fass ${GOODS[j][0]} verkauft: ${fmt(gain)} G (${profit>=0?'+':''}${fmt(profit)} G Handelsgewinn).`);completeQuests(j,n)}observe();render();marketView()}
function bathView(){openSheet('♨️ Das Badehaus',`<p>Warmer Dampf erfüllt den Raum. Ein geschwätziger Kaufmann plaudert über die Preise der Hanse.</p><div class="notice">Ein Bad kostet <b>15 Gold</b>. Meist erfährst du dabei einen brauchbaren Handelstipp. Selten erzählt jemand Unsinn – oder du stößt auf ein außergewöhnliches Geschäft!</div><button onclick="takeBath()" ${s.gold<15?'disabled':''}>🛁 Baden und lauschen · 15 G</button><button class="ghost" onclick="show('rumors')">📜 Meine Gerüchte</button><div id="bathresult"></div>`)}
function takeBath(){if(s.gold<15)return;s.gold-=15;advance(1);let dest=r(0,4);if(dest===s.city)dest=(dest+1)%5;let j=r(0,GOODS.length-1),special=Math.random()<.13,falseTip=!special&&Math.random()<.10;let m=s.markets[dest][j];let price=special?Math.round(GOODS[j][2]*2.4):falseTip?Math.round(m.price*1.6):m.price;let until=totalDay()+(special?r(3,6):r(6,12));if(special){s.markets[dest][j].price=price;s.markets[dest][j].stock=Math.max(5,Math.round(s.markets[dest][j].stock*.65))}let t=special?`GEHEIMTIPP! In ${CITIES[dest]} zahlt ein Händler für ${GOODS[j][0]} derzeit ${price} G je Fass! Angebot nur bis Tag ${until-s.year*360} (bei Jahreswechsel entsprechend später).`:falseTip?`Ein Gast behauptet, in ${CITIES[dest]} würden für ${GOODS[j][0]} etwa ${price} G gezahlt. Ob das stimmt?`:`Ein Kaufmann berichtet: In ${CITIES[dest]} kostet ${GOODS[j][0]} derzeit ungefähr ${price} G.`;s.rumors.unshift({city:dest,j,price,until,special,falseTip,text:t});s.rumors=s.rumors.slice(0,12);log('Im Badehaus einen Handelstipp gehört.');render();bathView();$('bathresult').innerHTML=`<div class="notice"><b>${special?'🌟 Seltenes Gerücht':'🗣️ Gespräch am Badezuber'}</b><p>${esc(t)}</p></div>`}
function churchView(){openSheet('⛪ Die Stadtkirche',`<p>Die Bürger sammeln für Bedürftige und die Instandhaltung der Kirche. Eine Spende kann dein Ansehen steigern – ist für den politischen Aufstieg aber keine Pflicht.</p><div class="grid"><div class="item"><h3>🪙 Kleine Spende</h3><p>50 Gold · +2 Ansehen</p><button onclick="donate(50,2)">Spenden</button></div><div class="item"><h3>💰 Großzügige Spende</h3><p>200 Gold · +5 Ansehen</p><button onclick="donate(200,5)">Spenden</button></div></div><p class="muted">Mit zunehmendem Ansehen wird der zusätzliche Nutzen kleiner.</p>`)}
function donate(g,rep){if(s.gold<g)return notice('Dafür reicht dein Gold nicht.');s.gold-=g;let gain=Math.max(1,rep-Math.floor(s.rep/55));s.rep+=gain;log(`${g} G für die Stadt gespendet (+${gain} Ansehen).`);render();churchView()}
function bankView(){openSheet('💰 Das Bankhaus',`<p>Der Bankier rückt seine Brille zurecht: „Gold soll arbeiten, werter Kaufmann!“</p><div class="grid"><div class="item"><h3>Dein Guthaben</h3><p><b>${fmt(s.bank)} G</b> · 2 % pro Spieljahr</p><div class="actions"><input type="number" min="1" value="100" id="deposit"><button onclick="bankOp('deposit')">Einzahlen</button><button class="ghost" onclick="bankOp('withdraw')">Abheben</button></div></div><div class="item"><h3>Dein Kredit</h3><p><b>${fmt(s.debt)} G</b> · 6 % pro Spieljahr</p><p class="muted">Kreditrahmen: ${fmt(creditLimit())} G</p><div class="actions"><input type="number" min="1" value="500" id="loan"><button onclick="bankOp('borrow')">Leihen</button><button class="ghost" onclick="bankOp('repay')">Tilgen</button></div></div></div><p class="muted">Die Zinsen werden beim Jahreswechsel berechnet. Ein Kredit rettet dich nicht vor jeder schlechten Entscheidung.</p>`)}
function creditLimit(){return Math.max(1000,Math.round(netWorth()*.45)+s.debt)}
function bankOp(op){let n=Math.floor(Number($(op==='deposit'||op==='withdraw'?'deposit':'loan').value));if(!Number.isFinite(n)||n<=0)return;if(op==='deposit'&&s.gold>=n){s.gold-=n;s.bank+=n}else if(op==='withdraw'&&s.bank>=n){s.bank-=n;s.gold+=n}else if(op==='borrow'&&s.debt+n<=creditLimit()){s.debt+=n;s.gold+=n}else if(op==='repay'&&s.gold>=n&&s.debt>=n){s.debt-=n;s.gold-=n}else return notice('Betrag nicht möglich. Prüfe Guthaben, Schulden und Kreditrahmen.');log(`Bankgeschäft: ${op} ${n} Gold.`);render();bankView()}
function harborView(){let q=ship(),repair=Math.ceil((100-q.condition)*8);openSheet('⚓ Hafen & Schiffswerft',`<p>Der Hafenmeister begrüßt dich. „Ein gutes Schiff ist das halbe Geschäft!“</p><div class="item"><h3>${esc(q.name)} · Zustand ${q.condition} %</h3><p>Laderaum: ${load(q)} / ${capacity(q)} Fass · Bewaffnung: Stufe ${q.arms}/3</p><p>Reparaturkosten: <b>${fmt(repair)} G</b></p><button onclick="repairShip()" ${repair===0||s.gold<repair?'disabled':''}>🔨 Schiff reparieren</button><button class="ghost" onclick="armShip()" ${q.arms>=3||s.gold<(q.arms+1)*550?'disabled':''}>🛡️ Bewaffnung verbessern (${(q.arms+1)*550} G)</button><p class="muted">Jede Bewaffnungsstufe kostet 10 Fass Laderaum und verbessert die Abwehr gegen Piraten.</p></div><div class="item"><h3>Neue Schiffe</h3><p class="muted">Die Werften bieten unterschiedliche Typen. Später kannst du Schiffe gemeinsam als Konvoi losschicken.</p>${SHIPTYPES.map((t,i)=>`<div class="split"><span>${t.name} · ${t.cap} Fass · Tempo ${t.speed}× · ${fmt(t.cost)} G</span><button ${s.gold<t.cost?'disabled':''} onclick="buyShip(${i})">Kaufen</button></div>`).join('')}</div><button class="ghost" onclick="show('ships')">⛵ Flotte ansehen</button>`)}
function repairShip(){let q=ship(),n=Math.ceil((100-q.condition)*8);if(n>s.gold)return;s.gold-=n;q.condition=100;log(`${q.name} für ${n} G repariert.`);render();harborView()}
function armShip(){let q=ship(),n=(q.arms+1)*550;if(q.arms>=3||s.gold<n||capacity(q)-10<load(q))return notice('Nicht genug Gold oder zu viel Ladung für die Bewaffnung.');s.gold-=n;q.arms++;log(`${q.name} auf Bewaffnungsstufe ${q.arms} aufgerüstet.`);render();harborView()}
function buyShip(i){let t=SHIPTYPES[i];if(s.gold<t.cost)return;s.gold-=t.cost;let q=makeShip(i);q.name=t.name+' '+(s.ships.length+1);s.ships.push(q);s.active=s.ships.length-1;log(`Neues Schiff gekauft: ${q.name}.`);render();harborView()}
function shipsView(){openSheet('⛵ Mein Schiffsbuch',`<p>Wähle das Schiff, das du beladen möchtest. Auf Reisen können alle Schiffe gemeinsam als Konvoi fahren.</p><div class="grid">${s.ships.map((q,i)=>`<div class="item"><h3>${i===s.active?'⭐ ':''}${esc(q.name)}</h3><p>${SHIPTYPES[q.type].name} · ${load(q)}/${capacity(q)} Fass</p><p>Zustand: ${q.condition} % · Bewaffnung: ${q.arms}/3</p><button class="ghost" onclick="s.active=${i};render();shipsView()">${i===s.active?'Ausgewählt':'Auswählen'}</button></div>`).join('')}</div><button onclick="show('harbor')">Zur Werft</button><button class="ghost" onclick="show('map')">Zur Seekarte</button>`)}
function contorView(){let level=s.rank>=3?3:s.rank>=2?2:s.rank>=1?1:0;let text=['Ein einfacher Schreibtisch, eine Seekarte und ein paar Kisten.','Ein ordentliches Kontor mit besseren Möbeln und gefüllten Regalen.','Ein gepflegtes Kaufmannshaus. Die Händler kennen deinen Namen.','Ein würdiges Haus mit einer großen Seekarte. Die Bürger grüßen respektvoll.'][level];openSheet('🏠 Dein Kontor',`<p>${text}</p><div class="item"><h3>📜 Kaufmannsbilanz</h3><p>Bargeld: <b>${fmt(s.gold)} G</b></p><p>Bankguthaben: <b>${fmt(s.bank)} G</b></p><p>Schulden: <b>${fmt(s.debt)} G</b></p><p>Warenwert (Schätzung): <b>${fmt(cargoWorth())} G</b></p><p>Nettovermögen inklusive Schiffe: <b>${fmt(netWorth())} G</b></p><p>Schiffe: <b>${s.ships.length}</b> · Erledigte Aufträge: <b>${s.completed}</b></p></div><p class="muted">Dein Kontor wächst dezent mit deinem Rang – ohne Paläste oder Statuen.</p><button onclick="show('quests')">📦 Handelsaufträge ansehen</button>`)}
function hallView(){let steps=[['Kaufmann',0,0],['Fernkaufmann',18000,0],['Ratsherr',45000,25],['Bürgermeister',85000,55],['Eldermann',180000,90]],next=steps[s.rank+1];openSheet('🏛️ Das Rathaus',`<p>Der Stadtrat tagt. Handelsgeschick, Wohlstand und Ansehen öffnen dir die Türen. Spenden sind nicht vorgeschrieben.</p><div class="item"><h3>Dein Rang: ${rank()}</h3><p>Vermögen: ${fmt(netWorth())} G · Ansehen: ${s.rep}</p>${next?`<p>Nächster Rang: <b>${next[0]}</b></p><p>Benötigt: ${fmt(next[1])} G Vermögen und ${next[2]} Ansehen.</p><button onclick="promote()" ${netWorth()<next[1]||s.rep<next[2]?'disabled':''}>${s.rank>=2?'Zur Wahl antreten':'Aufstieg beantragen'}</button>`:'<p>🏆 Du hast den höchsten Rang erreicht. Der Handel geht weiter!</p>'}</div><p class="muted">Ehrentitel: Ulf ist der Grüne Eldermann 🌿; Anders ist der Hansegras-Baron. Beide verfolgen die gleiche politische Karriere.</p>`)}
function promote(){let steps=[0,18000,45000,85000,180000],reps=[0,0,25,55,90],i=s.rank+1;if(i>4||netWorth()<steps[i]||s.rep<reps[i])return;if(i>=3&&Math.random()<.18){s.rep+=2;log('Die Wahl knapp verloren. Du erhältst +2 Ansehen und kannst es erneut versuchen.');render();hallView();return}s.rank=i;log(`${s.name} steigt auf: ${rank()}!`);render();notice(`🎉 Der Rat verkündet: ${s.name} ist nun ${rank()}!`)}
function questsView(){if(s.quests.length===0){let j=r(0,5),n=r(6,18),reward=n*GOODS[j][2]*2;s.quests.push({j,n,reward,until:totalDay()+r(8,15),city:s.city});save()}openSheet('📦 Handelsaufträge',`<p>Der Hafenmeister kennt Händler, die bestimmte Waren benötigen. Liefere die Ware in der angegebenen Stadt über das Handelsbuch. Der Auftrag wird beim Verkauf automatisch erfüllt.</p>${s.quests.map(q=>`<div class="item"><h3>${GOODS[q.j][1]} ${q.n} Fass ${GOODS[q.j][0]}</h3><p>Abgabe in <b>${CITIES[q.city]}</b> · Zusatzprämie: <b>${fmt(q.reward)} G</b></p><p>Gültig noch ${Math.max(0,q.until-totalDay())} Spieltage</p></div>`).join('')}<button class="ghost" onclick="show('market')">Zum Markt</button>`)}
function completeQuests(j,n){let found=s.quests.findIndex(q=>q.j===j&&q.city===s.city&&n>=q.n);if(found>=0){let q=s.quests.splice(found,1)[0];s.gold+=q.reward;s.rep+=4;s.completed++;log(`Handelsauftrag erfüllt! +${q.reward} G und +4 Ansehen.`)}}
function bookView(){openSheet('📒 Aufzeichnungen der Hanse',`<p>Nur besuchte Städte sind verzeichnet. Alte Preise können inzwischen abweichen.</p><div class="scroll"><table class="booktable"><thead><tr><th>Stadt</th>${GOODS.map(g=>`<th>${g[1]} ${g[0]}</th>`).join('')}<th>Stand</th></tr></thead><tbody>${CITIES.map((c,i)=>`<tr><th>${c}</th>${GOODS.map((g,j)=>`<td>${s.journal[i]?s.journal[i].prices[j]+' G':'—'}</td>`).join('')}<td>${s.journal[i]?'Tag '+s.journal[i].day:'Unbekannt'}</td></tr>`).join('')}</tbody></table></div><button class="ghost" onclick="show('rumors')">🗣️ Gerüchte ansehen</button>`)}
function rumorView(){openSheet('🗣️ Gerüchtebuch',`<p>Im Badehaus aufgeschnappte Hinweise. Sie sind nicht immer richtig.</p>${s.rumors.length?s.rumors.map(x=>`<div class="notice">${esc(x.text)}<br><span class="muted">Noch ${Math.max(0,x.until-totalDay())} Spieltage aktuell</span></div>`).join(''):'<p>Du hast noch keine Gerüchte gehört.</p>'}<button onclick="show('bath')">Zum Badehaus</button>`)}
function chronicleView(){openSheet('📜 Die Hansechronik',`${s.messages.map(t=>`<div class="notice">${esc(t)}</div>`).join('')}`)}
function mapView(){openSheet('🗺️ Die Seekarte',`<canvas class="mapart" id="mapCanvas" width="640" height="280"></canvas><p>Deine Flotte liegt in <b>${CITIES[s.city]}</b>. Reisen erfolgen ohne echte Wartezeit, verbrauchen aber Spieltage.</p><p class="muted">Schiffe mit mehr Tempo erreichen zeitlich begrenzte Handelsgelegenheiten schneller. Ein Konvoi fährt so schnell wie das langsamste Schiff.</p><div class="grid">${CITIES.map((c,i)=>`<div class="item"><h3>${c}</h3><p>Entfernung: ${DIST[s.city][i]} Seetage (Kogge)</p><button ${i===s.city?'disabled':''} onclick="planTravel(${i})">⛵ Segeln</button></div>`).join('')}</div>`);drawMap()}
function planTravel(dest){let convoy=s.ships.length>1&&confirm(`Alle ${s.ships.length} Schiffe als Konvoi nach ${CITIES[dest]} schicken?\nOK = Konvoi · Abbrechen = nur ausgewähltes Schiff`);let qs=convoy?s.ships:[ship()],speed=Math.min(...qs.map(q=>q.speed*(.65+.35*q.condition/100))),days=Math.max(1,Math.ceil(DIST[s.city][dest]/speed));pending={dest,days,convoy,qs:qs.map(q=>q.id),event:null};let arms=qs.reduce((a,q)=>a+q.arms,0),chance=Math.random(),story='Ein frischer Wind bläht die Segel. Möwen begleiten eure Fahrt.';if(chance<.13){let defended=Math.random()<Math.min(.94,.3+arms*.21+qs.length*.09);if(defended){story=arms?'Piraten nähern sich, doch eure bewaffnete Mannschaft schlägt sie zurück!':'Ein Piratenschiff taucht auf. Mit geschickten Manövern entkommt ihr unversehrt.';pending.event='defended'}else{let loss=Math.min(3,Math.max(1,r(1,3)));pending.event='pirates';pending.loss=loss;story='Piraten entern kurz euer Schiff! Ein Teil der Ladung geht verloren, ehe ihr entkommt.'}}else if(chance<.27){pending.event='storm';story='Ein heftiger Sturm schüttelt die Koggen. Die Mannschaft hält Kurs, doch das Holz ächzt.'}else if(chance<.40){story='Ein freundlicher Kapitän grüßt euch auf See und berichtet von ruhigen Handelswegen.'}pending.story=story;show('travel')}
function travelView(){openSheet('🌊 Auf hoher See',`<div class="sea" role="img" aria-label="Segelschiff auf der Ostsee"></div><p><b>${CITIES[s.city]} → ${CITIES[pending.dest]}</b> · ${pending.days} Spieltage · ${pending.convoy?'Konvoi':'Einzelschiff'}</p><div class="notice">${esc(pending.story)}</div><p class="muted">Keine Wartezeit: Nach deiner Bestätigung kommst du sofort an.</p><button onclick="arrive()">⚓ Weitersegeln</button>`)}
function arrive(){if(!pending)return;let p=pending,qs=s.ships.filter(q=>p.qs.includes(q.id));advance(p.days);if(p.event==='storm'){for(let q of qs)q.condition=Math.max(30,q.condition-r(3,10));log('Sturm auf See: Einige Schiffe wurden beschädigt.')}if(p.event==='pirates'){let q=qs.find(q=>load(q)>0);if(q){let j=Object.keys(q.cargo)[0],lost=Math.min(q.cargo[j],p.loss);q.cargo[j]-=lost;if(!q.cargo[j]){delete q.cargo[j];delete q.costs[j]}log(`Piraten raubten ${lost} Fass ${GOODS[j][0]}.`)}}if(p.event==='defended')log('Piraten erfolgreich zurückgeschlagen oder abgeschüttelt.');s.city=p.dest;s.visits++;s.rep+=1;observe();log(`In ${CITIES[s.city]} angekommen (+1 Ansehen).`);pending={...p};render();show('arrival')}
function arrivalView(){openSheet('⚓ Land in Sicht!',`<p style="font-size:23px"><b>Du bist in ${CITIES[s.city]} angekommen!</b></p><p>Die Stadt empfängt dich mit ihrem ganz eigenen Hafenbild. Neue Geschäfte warten.</p><p class="muted">Reisedauer: ${pending.days} Spieltage · Datum: Tag ${s.day}, ${s.year}</p><button onclick="closeSheet()">Stadt erkunden</button><button class="ghost" onclick="show('market')">Direkt zum Handel</button>`)}
function saveView(){openSheet('💾 Spielstand & Sicherung',`<p>Hansefürst speichert automatisch auf diesem Gerät und in diesem Browser. Für iPad/iPhone-Wechsel bitte exportieren.</p><div class="actions"><button onclick="exportGame()">⬇️ Spielstand exportieren</button><button class="ghost" onclick="$('file').click()">⬆️ Spielstand importieren</button></div><p class="muted">Version 0.3 übernimmt beim ersten Start automatisch einen vorhandenen Spielstand aus Version 0.2 auf derselben Webadresse. Deine alte Version bleibt unberührt.</p><hr><button class="danger" onclick="resetGame()">Neues Spiel beginnen</button>`)}
function exportGame(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hansefuerst-0-3-spielstand.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importGame(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=migrate(JSON.parse(rd.result));if(!x||!Array.isArray(x.ships)||!Array.isArray(x.markets)||x.markets.length!==5)throw Error();if(s&&!confirm('Den aktuellen Spielstand überschreiben?'))return;s=x;observe();save();closeSheet();notice('Spielstand erfolgreich importiert!')}catch(err){alert('Kein gültiger Hansefürst-Spielstand.')}e.target.value=''};rd.readAsText(f)}
function resetGame(){if(!confirm('Wirklich neu anfangen? Der aktuelle Spielstand wird überschrieben. Bitte vorher exportieren!'))return;s=null;localStorage.removeItem(KEY);closeSheet();welcome()}
function welcome(){openSheet('⚓ Willkommen bei Hansefürst',`<p>Anno 1350. Beginne als Kaufmann in Lübeck und arbeite dich durch geschickten Handel nach oben.</p><label>Dein Kaufmann<select id="player"><option value="Ulf">Ulf – Der Grüne Eldermann</option><option value="Anders">Anders – Der Hansegras-Baron</option></select></label><label>Name<input id="playername" value="Ulf" maxlength="24"></label><button onclick="startGame()">Handelsreise beginnen ⚓</button><p class="muted">Tipp: Tippe auf die Gebäude im Hafen. Zum Handeln öffnest du das Buch; im Badehaus hörst du Gerüchte.</p>`)}
function startGame(){let p=$('player').value,n=$('playername').value.trim()||p;s=fresh(p,n);observe();save();closeSheet();render()}
// Pixel graphics, drawn locally; no external assets or network required.
function rect(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}function poly(c,points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
function drawCity(){let cv=$('cityCanvas'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;let ci=s.city,pal=[['#83a8ae','#b9a07d','#8b4c3e','#523a36'],['#819aa3','#ad9275','#82583e','#48403c'],['#8eafb4','#d1a47d','#a04e3c','#623a35'],['#83a5b5','#b6a18b','#a45b4c','#523e4b'],['#a1a7a0','#c9a57e','#9b6749','#584538']][ci];rect(c,0,0,640,330,pal[0]);rect(c,0,0,640,90,ci===4?'#94a7a5':'#80a6b6');rect(c,0,90,640,85,'#e2c59e');for(let i=0;i<14;i++)rect(c,(i*83+17)%640,(i*31+12)%95,21,3,'#e1d5bb');
// Distinctive buildings by city: towers, stepped gables, timber houses and differing colors.
for(let i=0;i<14;i++){let x=i*49-8,h=49+((i*23+ci*11)%56),base=186-h;rect(c,x,base,48,h,pal[2]);rect(c,x+4,base+5,40,h-5,i%3===0?pal[1]:i%3===1?'#c18d64':'#a96e51');if((i+ci)%3===0){for(let k=0;k<3;k++)rect(c,x+9+k*11,base-9+(k%2)*3,9,11,pal[2]);poly(c,[[x+1,base],[x+24,base-21],[x+47,base]],pal[3])}else if(ci===1||ci===3){poly(c,[[x,base],[x+24,base-25],[x+48,base]],'#55423b')}else poly(c,[[x,base],[x+24,base-16],[x+48,base]],pal[3]);for(let k=0;k<3;k++)rect(c,x+7+k*13,base+20,7,11,'#354b4e');rect(c,x+19,base+46,12,18,'#51392c')}
let towers=[[135,42,22,146],[335,25,25,161],[505,55,18,130]];if(ci===0)towers=[[170,20,28,169],[185,12,13,170],[447,37,25,150]];if(ci===1)towers=[[290,48,20,140],[430,32,28,150]];if(ci===2)towers=[[150,38,23,150],[365,17,25,171]];if(ci===3)towers=[[230,38,20,150],[245,26,12,155],[510,52,20,136]];if(ci===4)towers=[[115,53,22,140],[395,25,28,165]];
for(let [x,y,w,h] of towers){rect(c,x,y,w,h,'#a78366');poly(c,[[x-5,y+4],[x+w/2,y-22],[x+w+5,y+4]],ci===3?'#483c52':'#57423c');rect(c,x+w/2-3,y+10,6,14,'#2e4346');rect(c,x+w/2-2,y-21,3,14,'#f0d79d')}
rect(c,0,179,640,151,ci===4?'#315e6d':'#2b7185');for(let y=191;y<330;y+=13)for(let x=(y%4)*9;x<640;x+=47)rect(c,x,y,22,3,(x+y)%2?'#5395a0':'#43899a');rect(c,0,176,640,10,'#745339');for(let x=0;x<640;x+=28){rect(c,x,186,6,30,'#64482f');rect(c,x+3,177,21,4,'#b28c58')}
// Vary vessel silhouettes and placement.
let sx=ci%2?220:260;poly(c,[[sx-115,261],[sx+112,261],[sx+83,296],[sx-91,296]],'#4b3027');rect(c,sx-95,266,177,16,'#90613b');for(let x=sx-85;x<sx+80;x+=19)rect(c,x,271,11,4,'#d0a06b');rect(c,sx-2,155,7,106,'#543a29');poly(c,[[sx+6,160],[sx+6,254],[sx+81,246]],'#f0dbac');poly(c,[[sx-5,165],[sx-5,249],[sx-73,246]],'#d7bc91');rect(c,sx-4,151,45,5,'#805535');rect(c,sx-26,144,32,13,ci===2?'#a23b36':'#8c413a');rect(c,sx-23,135,5,13,'#4a3428');rect(c,sx-80,255,170,6,'#c18a54');for(let x=0;x<640;x+=75)rect(c,x+9,306+(x%5),30,3,'#5e9aa5');
// Street life silhouettes and city accents.
for(let i=0;i<7;i++){let x=35+i*87+(ci*11)%29,y=178+(i%3)*4;rect(c,x,y-15,6,7,'#d6a17c');rect(c,x-3,y-8,12,12,['#6e4d38','#405b50','#7a3e40'][i%3]);rect(c,x,y+4,3,8,'#392f2b');rect(c,x+6,y+4,3,8,'#392f2b')}
if(ci===1){rect(c,550,120,12,57,'#56402f');poly(c,[[555,110],[608,156],[555,156]],'#e5d8b4')}if(ci===2){rect(c,36,145,70,31,'#79513d');for(let i=0;i<4;i++)rect(c,40+i*17,145,13,15,'#bda070')}if(ci===4){rect(c,572,113,9,67,'#60432f');poly(c,[[580,117],[616,151],[580,151]],'#cbb58e')}
}
function drawMap(){let cv=$('mapCanvas');if(!cv)return;let c=cv.getContext('2d');c.imageSmoothingEnabled=false;rect(c,0,0,640,280,'#457a8a');poly(c,[[0,0],[215,0],[225,50],[160,91],[126,155],[0,180]],'#b4ae7d');poly(c,[[359,0],[640,0],[640,280],[514,280],[479,230],[421,191],[452,117],[393,77]],'#c1b083');poly(c,[[0,228],[86,211],[136,280],[0,280]],'#b2ac79');let pts=[[110,185],[53,120],[274,138],[359,167],[512,191]];c.strokeStyle='#f2d69b';c.setLineDash([6,6]);c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();c.setLineDash([]);pts.forEach(([x,y],i)=>{rect(c,x-6,y-6,13,13,i===s.city?'#ffde79':'#9d4935');c.fillStyle='#fff1c6';c.font='16px Georgia';c.fillText(CITIES[i],Math.min(535,x+13),y+4)})}
const oldShow=show;show=function(v){if(v==='rumors')return rumorView();return oldShow(v)};
try{let x=localStorage.getItem(KEY);if(x)s=migrate(JSON.parse(x));else{let old=localStorage.getItem(OLD);if(old)s=migrate(JSON.parse(old))}}catch(e){console.warn(e)}if(s){if(!s.ships?.length)s=null;else{observe();render()}}if(!s)welcome();
</script></body></html>
